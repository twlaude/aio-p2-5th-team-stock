# 소스에서 이미지를 직접 빌드해 전체 스택을 띄우는 파일이다(개발·이미지 제작용).
#   docker compose up -d --build
# Docker Hub 이미지만 받아서 실행하려면 compose.release.yml을 쓴다(두 파일을 같이 쓰지 않는다).
# 각 서비스의 비밀값은 서비스 폴더의 .env에서 읽는다(각 폴더의 .env.example 참고).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # pgvector/pgvector:pg16 위에 db/schema.sql·seed.sql과 disclosure DB 초기화 스크립트를 구워 넣는다.
    build:
      context: .
      dockerfile: infra/postgres.Dockerfile
    image: ykw492/team5-postgres:${TAG:-latest}
    container_name: stock_insight_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_insight}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # init 스크립트가 두 번째 DB를 만들 때 쓰는 이름. disclosure_mcp 전용 DB.
      DISCLOSURE_POSTGRES_DB: ${DISCLOSURE_POSTGRES_DB:-stock_disclosure}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: stock_insight_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  price_mcp:
    build:
      context: ./mcp_servers/price_mcp
    image: ykw492/team5-price-mcp:${TAG:-latest}
    container_name: price_mcp
    restart: unless-stopped
    env_file: ${PRICE_MCP_ENV_FILE:-./mcp_servers/price_mcp/.env}
    ports:
      - "8020:8020"
    logging: *default-logging

  news_mcp:
    build:
      context: ./mcp_servers/news_mcp
    image: ykw492/team5-news-mcp:${TAG:-latest}
    container_name: news_mcp
    restart: unless-stopped
    env_file: ${NEWS_MCP_ENV_FILE:-./mcp_servers/news_mcp/.env}
    ports:
      # macOS는 8021을 시스템 ftp-proxy가 쓰므로 .env에서 NEWS_MCP_PORT=18021 로 바꾼다.
      - "${NEWS_MCP_PORT:-8021}:8021"
    logging: *default-logging

  disclosure_mcp:
    build:
      context: ./mcp_servers/disclosure_mcp
    image: ykw492/team5-disclosure-mcp:${TAG:-latest}
    container_name: disclosure_mcp
    restart: unless-stopped
    env_file: ${DISCLOSURE_MCP_ENV_FILE:-./mcp_servers/disclosure_mcp/.env}
    environment:
      # disclosure_mcp는 backend와 다른 전용 DB를 쓴다(위 postgres 서비스가 초기화 스크립트로 생성).
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${DISCLOSURE_POSTGRES_DB:-stock_disclosure}
    ports:
      - "8022:8022"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  community_mcp:
    build:
      context: ./mcp_servers/community_mcp
    image: ykw492/team5-community-mcp:${TAG:-latest}
    container_name: community_mcp
    restart: unless-stopped
    env_file: ${COMMUNITY_MCP_ENV_FILE:-./mcp_servers/community_mcp/.env}
    ports:
      - "8023:8023"
    logging: *default-logging

  mcp_client:
    build:
      context: ./mcp_client
    image: ykw492/team5-mcp-client:${TAG:-latest}
    container_name: mcp_client
    restart: unless-stopped
    env_file: ${MCP_CLIENT_ENV_FILE:-./mcp_client/.env}
    environment:
      # 컨테이너 네트워크 안에서는 서비스 이름으로 서로를 찾는다(localhost 금지).
      PRICE_MCP_URL: http://price_mcp:8020/mcp
      NEWS_MCP_URL: http://news_mcp:8021/mcp
      DISCLOSURE_MCP_URL: http://disclosure_mcp:8022/mcp
      COMMUNITY_MCP_URL: http://community_mcp:8023/mcp
    ports:
      - "8010:8010"
    depends_on:
      - price_mcp
      - news_mcp
      - disclosure_mcp
      - community_mcp
    logging: *default-logging

  backend:
    build:
      # backend/Dockerfile 주석대로 빌드 컨텍스트는 반드시 저장소 루트다.
      # (shared/supported_companies.json을 이미지에 담아야 하기 때문)
      context: .
      dockerfile: backend/Dockerfile
    image: ykw492/team5-backend:${TAG:-latest}
    container_name: backend
    restart: unless-stopped
    env_file: ${BACKEND_ENV_FILE:-./backend/.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-stock_insight}
      REDIS_URL: redis://redis:6379/0
      MCP_CLIENT_URL: http://mcp_client:8010
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp_client:
        condition: service_started
    logging: *default-logging

  frontend:
    build:
      # CompanyRail.tsx가 shared/supported_companies.json을 import하므로 빌드 컨텍스트는 저장소 루트다.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Vite는 이 두 값을 빌드 시점에 번들/이미지에 굽는다(런타임 env로 못 바꿈).
        # VITE_BACKEND_URL은 "브라우저가 접속할 주소"가 아니라, 프론트 컨테이너 안의
        # Vite preview 서버가 /api 요청을 서버사이드로 대신 전달(프록시)할 대상이다.
        # 그래서 브라우저 도달 가능 여부와 무관하게 컨테이너 네트워크 이름을 쓴다.
        VITE_API_MODE: ${VITE_API_MODE:-live}
        VITE_BACKEND_URL: http://backend:8000
    image: ykw492/team5-frontend:${TAG:-latest}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      - backend
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
